<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Админ-панель | Первенство МИФИ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #bfbfdb;
            padding: 20px 12px 40px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Карточки */
        .card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            margin-bottom: 28px;
            overflow: hidden;
        }
        .card-header {
            background: #0b0829;
            color: white;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-body { padding: 20px; }
        
        /* Группы */
        .group-container {
            background: #fefefe;
            border-radius: 24px;
            margin-bottom: 30px;
            border: 1px solid #e0ddf5;
        }
        .group-title-bar {
            background: #eae9fc;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-weight: 700;
        }
        .group-title-bar input {
            font-size: 1rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 40px;
            border: 1px solid #cbc8e0;
        }
        .table-wrapper { overflow-x: auto; padding: 16px; }
        .tournament-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 500px;
        }
        .tournament-table th, .tournament-table td {
            border: 1px solid #d4d4e0;
            padding: 10px 8px;
            text-align: center;
        }
        .tournament-table th { background: #f5f4ff; font-weight: 700; }
        .player-col { font-weight: 700; background: #faf9ff; text-align: left !important; }
        .win-cell { background-color: #c8f0d1 !important; }
        .stats-col { background: #f5f3ff; font-weight: 600; }
        .editable-input {
            width: 100%;
            padding: 6px 4px;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            font-size: 0.75rem;
            font-family: monospace;
            text-align: center;
        }
        .btn-icon {
            background: #f0eef5;
            border: none;
            border-radius: 40px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-primary {
            background: #0b0829;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-green { background: #2b6e3c; }
        .btn-blue { background: #1e5a8a; }
        
        /* Олимпийка */
        .bracket-container { display: flex; flex-direction: column; gap: 24px; }
        .bracket-stage { background: #faf9ff; border-radius: 24px; padding: 16px; }
        .stage-title { font-weight: 800; margin-bottom: 16px; padding-left: 12px; border-left: 4px solid #0b0829; }
        .matches-list { display: flex; flex-direction: column; gap: 16px; }
        .match-card { background: white; border-radius: 20px; padding: 14px; border: 1px solid #e2defc; }
        .match-players-row { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
        .match-players-row input, .match-players-row span { flex: 1; text-align: center; font-weight: 600; }
        .match-score-row input, .match-score-row span { width: 100%; text-align: center; background: #f1efff; padding: 8px; border-radius: 30px; font-family: monospace; }
        .delete-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: #b91c1c; }
        
        .admin-panel { background: #f8f7fc; border-radius: 32px; padding: 18px; margin-bottom: 24px; border: 2px solid #cbc8e0; }
        .status { font-size: 0.75rem; margin-top: 10px; text-align: center; padding: 6px; border-radius: 30px; }
        .status-success { background: #d4e0b2; color: #2b6e3c; }
        .status-error { background: #f0d6d6; color: #b91c1c; }
        @media (min-width: 768px) { .bracket-container { flex-direction: row; flex-wrap: wrap; } .bracket-stage { flex: 1; } }
    </style>
</head>
<body>
<div class="container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="font-size: 2rem; background: linear-gradient(135deg,#0b0829,#413a7c); background-clip: text; -webkit-background-clip: text; color: transparent;">🏸 Админ-панель · Первенство МИФИ</h1>
        <p style="color: #4a457a;">Вводите данные → Сохраняйте на сервер → Участники увидят обновления</p>
    </div>

    <div class="admin-panel">
        <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
            <input type="password" id="adminCode" class="editable-input" style="width: 200px;" placeholder="Код">
            <button id="loginBtn" class="btn-primary">🔓 Войти</button>
            <button id="saveBtn" class="btn-primary btn-green" disabled>☁️ Сохранить на сервер</button>
            <button id="loadBtn" class="btn-primary btn-blue" disabled>⬇️ Загрузить с сервера</button>
            <button id="resetBtn" class="btn-primary" style="background:#8b5e3c;" disabled>⟳ Сбросить всё</button>
        </div>
        <div id="status" class="status"></div>
    </div>

    <!-- Мужской разряд -->
    <div class="card">
        <div class="card-header">
            <span>🏸 Мужской одиночный разряд</span>
            <div id="maleGroupActions" style="display: none;"><button id="addMaleGroupBtn" class="btn-primary btn-green">➕ Добавить группу</button></div>
        </div>
        <div class="card-body" id="maleGroupsContainer"></div>
    </div>
    <div class="card">
        <div class="card-header">
            <span>🏆 Мужская олимпийская сетка</span>
            <div id="maleBracketActions" style="display: none;"><button id="addMaleMatchBtn" class="btn-primary btn-green">➕ Добавить матч</button></div>
        </div>
        <div class="card-body"><div id="maleBracket" class="bracket-container"></div></div>
    </div>

    <!-- Женский разряд -->
    <div class="card">
        <div class="card-header">
            <span>🏸 Женский одиночный разряд</span>
            <div id="femaleGroupActions" style="display: none;"><button id="addFemaleGroupBtn" class="btn-primary btn-green">➕ Добавить группу</button></div>
        </div>
        <div class="card-body" id="femaleGroupsContainer"></div>
    </div>
    <div class="card">
        <div class="card-header">
            <span>🥈 Женская олимпийская сетка</span>
            <div id="femaleBracketActions" style="display: none;"><button id="addFemaleMatchBtn" class="btn-primary btn-green">➕ Добавить матч</button></div>
        </div>
        <div class="card-body"><div id="femaleBracket" class="bracket-container"></div></div>
    </div>
</div>

<script>
    // ========== ДАННЫЕ ==========
    let maleGroups = [], femaleGroups = [], maleBracketStages = [], femaleBracketStages = [];
    let isAdmin = false;
    let currentBinId = localStorage.getItem('mefi_bin_id') || null;
    
    // ========== ПОДСЧЁТ ПОБЕД ПО ПАРТИЯМ ==========
    function determineWinner(scoreStr) {
        if (!scoreStr) return null;
        let parts = scoreStr.split(',').map(s => s.trim());
        let p1Wins = 0, p2Wins = 0;
        for (let part of parts) {
            let s = part.split(':');
            if (s.length === 2) {
                if (parseInt(s[0]) > parseInt(s[1])) p1Wins++;
                else if (parseInt(s[1]) > parseInt(s[0])) p2Wins++;
            }
        }
        if (p1Wins > p2Wins) return 1;
        if (p2Wins > p1Wins) return 2;
        return null;
    }
    
    function calcStats(group) {
        return group.players.map((_, i) => {
            let wins = 0, diff = 0;
            for (let j = 0; j < group.players.length; j++) {
                if (i === j) continue;
                let score = group.scores[i]?.[j];
                if (score) {
                    let winner = determineWinner(score);
                    if (winner === 1) wins++;
                    let myTotal = 0, oppTotal = 0;
                    score.split(',').forEach(p => {
                        let sc = p.split(':');
                        if (sc.length === 2) { myTotal += parseInt(sc[0])||0; oppTotal += parseInt(sc[1])||0; }
                    });
                    diff += myTotal - oppTotal;
                }
            }
            return { wins, diff, total: group.players.length - 1 };
        });
    }
    
    function createGroup(name) { return { name, players: [], scores: [] }; }
    function addPlayer(g, name = "Новый") { g.players.push(name); g.scores.forEach(r => r.push('')); g.scores.push(Array(g.players.length).fill('')); for(let i=0;i<g.players.length;i++) g.scores[i][i] = ''; }
    function removePlayer(g, idx) { g.players.splice(idx,1); g.scores.splice(idx,1); for(let i=0;i<g.scores.length;i++) g.scores[i].splice(idx,1); }
    function initBracket() { return [{ name: "Четвертьфиналы", matches: [] }, { name: "Полуфиналы", matches: [] }, { name: "Финал / 3 место", matches: [] }]; }
    
    // Рендер
    function renderAll() {
        renderGroups('maleGroupsContainer', maleGroups, true);
        renderGroups('femaleGroupsContainer', femaleGroups, false);
        renderBracket('maleBracket', maleBracketStages);
        renderBracket('femaleBracket', femaleBracketStages);
    }
    
    function renderGroups(containerId, groups, isMale) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        groups.forEach((group, idx) => {
            const div = document.createElement('div');
            div.className = 'group-container';
            const title = document.createElement('div');
            title.className = 'group-title-bar';
            if (isAdmin) {
                let inp = document.createElement('input');
                inp.value = group.name;
                inp.onchange = (e) => { group.name = e.target.value; renderAll(); };
                title.appendChild(inp);
                let btnDiv = document.createElement('div');
                let addBtn = document.createElement('button');
                addBtn.textContent = '+ Игрок';
                addBtn.className = 'btn-icon';
                addBtn.onclick = () => { addPlayer(group); renderAll(); };
                let delBtn = document.createElement('button');
                delBtn.textContent = '🗑 Удалить группу';
                delBtn.className = 'btn-icon';
                delBtn.style.background = '#f0d6d6';
                delBtn.onclick = () => { groups.splice(idx,1); renderAll(); };
                btnDiv.appendChild(addBtn); btnDiv.appendChild(delBtn);
                title.appendChild(btnDiv);
            } else title.innerHTML = `<span>${escapeHtml(group.name)}</span>`;
            div.appendChild(title);
            
            const wrapper = document.createElement('div');
            wrapper.className = 'table-wrapper';
            const table = document.createElement('table');
            table.className = 'tournament-table';
            const n = group.players.length;
            const stats = calcStats(group);
            
            let thead = '<thead><tr><th>Игроки</th>';
            for (let i=0; i<n; i++) thead += `<th>${isAdmin ? `<input class="editable-input" value="${escapeHtml(group.players[i])}" data-group="${idx}" data-p="${i}" style="min-width:80px;">` : escapeHtml(group.players[i])}</th>`;
            thead += '<th>В/П</th><th>Разница</th>';
            if (isAdmin) thead += '<th></th>';
            thead += '</tr></thead><tbody>';
            
            for (let i=0; i<n; i++) {
                let row = `<tr><td class="player-col">${isAdmin ? `<input class="editable-input" value="${escapeHtml(group.players[i])}" data-group="${idx}" data-p="${i}" style="min-width:100px;">` : escapeHtml(group.players[i])}</td>`;
                for (let j=0; j<n; j++) {
                    if (i===j) row += '<td>—</td>';
                    else {
                        let val = group.scores[i][j] || '';
                        if (isAdmin) row += `<td><input class="editable-input score-cell" value="${escapeHtml(val)}" data-group="${idx}" data-i="${i}" data-j="${j}" placeholder="21:15,18:21"></td>`;
                        else {
                            let cls = determineWinner(val) === 1 ? 'win-cell' : '';
                            row += `<td class="${cls}">${escapeHtml(val)}</td>`;
                        }
                    }
                }
                row += `<td class="stats-col">${stats[i].wins}/${stats[i].total-stats[i].wins}</td>`;
                row += `<td class="stats-col">${stats[i].diff}</td>`;
                if (isAdmin) row += `<td><button class="delete-btn" data-group="${idx}" data-p="${i}">✖</button></td>`;
                row += '</tr>';
                table.innerHTML += row;
            }
            table.innerHTML += '</tbody>';
            wrapper.appendChild(table);
            div.appendChild(wrapper);
            container.appendChild(div);
        });
        
        if (isAdmin) {
            document.querySelectorAll('input[data-group][data-p]').forEach(inp => {
                inp.onchange = (e) => {
                    let g = parseInt(inp.dataset.group);
                    let p = parseInt(inp.dataset.p);
                    if (groups[g]) groups[g].players[p] = inp.value;
                    renderAll();
                };
            });
            document.querySelectorAll('input[data-group][data-i]').forEach(inp => {
                inp.onchange = (e) => {
                    let g = parseInt(inp.dataset.group);
                    let i = parseInt(inp.dataset.i);
                    let j = parseInt(inp.dataset.j);
                    if (groups[g]) groups[g].scores[i][j] = inp.value;
                    renderAll();
                };
            });
            document.querySelectorAll('.delete-btn[data-group][data-p]').forEach(btn => {
                btn.onclick = (e) => {
                    let g = parseInt(btn.dataset.group);
                    let p = parseInt(btn.dataset.p);
                    if (groups[g]) removePlayer(groups[g], p);
                    renderAll();
                };
            });
        }
    }
    
    function renderBracket(containerId, bracketData) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        bracketData.forEach((stage, si) => {
            const div = document.createElement('div');
            div.className = 'bracket-stage';
            div.innerHTML = `<div class="stage-title">${stage.name}</div><div class="matches-list"></div>`;
            const list = div.querySelector('.matches-list');
            stage.matches.forEach((match, mi) => {
                const card = document.createElement('div');
                card.className = 'match-card';
                if (isAdmin) {
                    card.innerHTML = `
                        <div class="match-players-row"><input placeholder="Игрок 1" value="${escapeHtml(match.p1)}" data-s="${si}" data-m="${mi}" data-f="p1"><span>vs</span><input placeholder="Игрок 2" value="${escapeHtml(match.p2)}" data-s="${si}" data-m="${mi}" data-f="p2"></div>
                        <div class="match-score-row"><input placeholder="Счёт (21:15,18:21,21:10)" value="${escapeHtml(match.score)}" data-s="${si}" data-m="${mi}" data-f="score"></div>
                        <div><input placeholder="Победитель" value="${escapeHtml(match.winner)}" data-s="${si}" data-m="${mi}" data-f="winner" style="width:100%; padding:8px; border-radius:30px;"></div>
                        <button class="delete-btn" data-s="${si}" data-m="${mi}">🗑 Удалить матч</button>
                    `;
                } else {
                    card.innerHTML = `<div class="match-players-row"><span>${escapeHtml(match.p1) || '—'}</span><span>⚡</span><span>${escapeHtml(match.p2) || '—'}</span></div>
                        <div class="match-score-row"><span>${escapeHtml(match.score) || '—'}</span></div>
                        <div class="winner-badge" style="background:#0b0829;color:white;padding:6px;border-radius:40px;text-align:center;">${match.winner ? '✅ '+escapeHtml(match.winner) : '—'}</div>`;
                }
                list.appendChild(card);
            });
            if (isAdmin) {
                let addBtn = document.createElement('button');
                addBtn.textContent = '+ Добавить матч';
                addBtn.style.cssText = 'margin-top:12px; background:#eae5fc; border:none; border-radius:40px; padding:8px; cursor:pointer;';
                addBtn.onclick = () => { bracketData[si].matches.push({ p1:"", p2:"", score:"", winner:"" }); renderAll(); };
                div.appendChild(addBtn);
            }
            container.appendChild(div);
        });
        if (isAdmin) {
            document.querySelectorAll(`#${containerId} input[data-s]`).forEach(inp => {
                inp.onchange = (e) => {
                    let s = parseInt(inp.dataset.s);
                    let m = parseInt(inp.dataset.m);
                    let f = inp.dataset.f;
                    if (bracketData[s] && bracketData[s].matches[m]) bracketData[s].matches[m][f] = inp.value;
                    renderAll();
                };
            });
            document.querySelectorAll(`#${containerId} button[data-s][data-m]`).forEach(btn => {
                btn.onclick = (e) => {
                    let s = parseInt(btn.dataset.s);
                    let m = parseInt(btn.dataset.m);
                    if (bracketData[s]) bracketData[s].matches.splice(m,1);
                    renderAll();
                };
            });
        }
    }
    
    function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function addGroup(isMale) { let g = createGroup(`Группа ${(isMale?maleGroups.length+1:femaleGroups.length+1)}`); if(isMale) maleGroups.push(g); else femaleGroups.push(g); renderAll(); }
    function addMatch(isMale) { let b = isMale ? maleBracketStages : femaleBracketStages; if(b[0]) b[0].matches.push({ p1:"", p2:"", score:"", winner:"" }); renderAll(); }
    
    function showStatus(msg, type) { let d = document.getElementById('status'); d.innerHTML = msg; d.className = `status status-${type}`; setTimeout(() => { if(d) d.innerHTML = ''; }, 4000); }
    
    async function saveToServer() {
        showStatus('☁️ Сохранение...', 'success');
        const data = { maleGroups, femaleGroups, maleBracketStages, femaleBracketStages, updated: new Date().toISOString() };
        try {
            let response;
            if (currentBinId) {
                response = await fetch(`https://api.jsonbin.io/v3/b/${currentBinId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } else {
                response = await fetch('https://api.jsonbin.io/v3/b', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            }
            if (response.ok) {
                let result = await response.json();
                currentBinId = result.metadata?.id || result.id;
                localStorage.setItem('mefi_bin_id', currentBinId);
                showStatus('✅ Сохранено! ID: ' + currentBinId.substring(0,8), 'success');
            } else throw new Error();
        } catch(e) { showStatus('❌ Ошибка сохранения', 'error'); }
    }
    
    async function loadFromServer() {
        if (!currentBinId) { showStatus('⚠️ Сначала сохраните данные', 'error'); return; }
        showStatus('☁️ Загрузка...', 'success');
        try {
            let response = await fetch(`https://api.jsonbin.io/v3/b/${currentBinId}/latest`, { headers: { 'X-Bin-Meta': 'false' } });
            if (response.ok) {
                let data = await response.json();
                if (data.maleGroups) maleGroups = data.maleGroups;
                if (data.femaleGroups) femaleGroups = data.femaleGroups;
                if (data.maleBracketStages) maleBracketStages = data.maleBracketStages;
                if (data.femaleBracketStages) femaleBracketStages = data.femaleBracketStages;
                renderAll();
                showStatus('✅ Загружено!', 'success');
            } else throw new Error();
        } catch(e) { showStatus('❌ Ошибка загрузки', 'error'); }
    }
    
    function resetLocal() { if(confirm('Очистить всё?')) { maleGroups=[]; femaleGroups=[]; maleBracketStages=initBracket(); femaleBracketStages=initBracket(); renderAll(); showStatus('🔄 Очищено', 'success'); } }
    
    function setAdmin(enable) {
        isAdmin = enable;
        document.getElementById('saveBtn').disabled = !enable;
        document.getElementById('loadBtn').disabled = !enable;
        document.getElementById('resetBtn').disabled = !enable;
        document.getElementById('maleGroupActions').style.display = enable ? 'block' : 'none';
        document.getElementById('maleBracketActions').style.display = enable ? 'block' : 'none';
        document.getElementById('femaleGroupActions').style.display = enable ? 'block' : 'none';
        document.getElementById('femaleBracketActions').style.display = enable ? 'block' : 'none';
        renderAll();
    }
    
    document.getElementById('loginBtn').onclick = () => {
        if (document.getElementById('adminCode').value === 'BDMEPHI2026') setAdmin(true);
        else alert('Неверный код');
    };
    document.getElementById('saveBtn').onclick = saveToServer;
    document.getElementById('loadBtn').onclick = loadFromServer;
    document.getElementById('resetBtn').onclick = resetLocal;
    document.getElementById('addMaleGroupBtn').onclick = () => addGroup(true);
    document.getElementById('addFemaleGroupBtn').onclick = () => addGroup(false);
    document.getElementById('addMaleMatchBtn').onclick = () => addMatch(true);
    document.getElementById('addFemaleMatchBtn').onclick = () => addMatch(false);
    
    maleBracketStages = initBracket();
    femaleBracketStages = initBracket();
    renderAll();
    setAdmin(false);
</script>
</body>
</html>
