<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Первенство МИФИ · Турнир</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #bfbfdb;
            padding: 20px 12px 40px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            margin-bottom: 28px;
            overflow: hidden;
        }
        .card-header {
            background: #0b0829;
            color: white;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-weight: 700;
        }
        .card-body { padding: 20px; }
        .group-container {
            background: #fefefe;
            border-radius: 24px;
            margin-bottom: 30px;
            border: 1px solid #e0ddf5;
        }
        .group-title-bar {
            background: #eae9fc;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .table-wrapper { overflow-x: auto; padding: 16px; }
        .tournament-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 500px;
        }
        .tournament-table th, .tournament-table td {
            border: 1px solid #d4d4e0;
            padding: 10px 8px;
            text-align: center;
        }
        .tournament-table th { background: #f5f4ff; font-weight: 700; }
        .player-col { font-weight: 700; background: #faf9ff; text-align: left !important; }
        .win-cell { background-color: #c8f0d1 !important; }
        .stats-col { background: #f5f3ff; font-weight: 600; }
        .bracket-container { display: flex; flex-direction: column; gap: 24px; }
        .bracket-stage { background: #faf9ff; border-radius: 24px; padding: 16px; }
        .stage-title { font-weight: 800; margin-bottom: 16px; padding-left: 12px; border-left: 4px solid #0b0829; }
        .matches-list { display: flex; flex-direction: column; gap: 16px; }
        .match-card { background: white; border-radius: 20px; padding: 14px; border: 1px solid #e2defc; }
        .match-players-row { display: flex; gap: 12px; justify-content: space-between; margin-bottom: 10px; }
        .match-players-row span { flex: 1; text-align: center; font-weight: 600; }
        .match-score-row span { display: block; text-align: center; background: #f1efff; padding: 8px; border-radius: 30px; font-family: monospace; }
        .winner-badge { background: #0b0829; color: white; padding: 6px; border-radius: 40px; text-align: center; font-size: 0.75rem; }
        .admin-panel { background: #f8f7fc; border-radius: 32px; padding: 18px; margin-bottom: 24px; border: 2px solid #cbc8e0; text-align: center; }
        .btn-primary { background: #0b0829; color: white; border: none; padding: 8px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; }
        .status { font-size: 0.75rem; margin-top: 10px; padding: 6px; border-radius: 30px; }
        .status-success { background: #d4e0b2; color: #2b6e3c; }
        .status-error { background: #f0d6d6; color: #b91c1c; }
        @media (min-width: 768px) { .bracket-container { flex-direction: row; flex-wrap: wrap; } .bracket-stage { flex: 1; } }
    </style>
</head>
<body>
<div class="container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="font-size: 2.2rem; background: linear-gradient(135deg,#0b0829,#413a7c); background-clip: text; -webkit-background-clip: text; color: transparent;">🏸 Первенство МИФИ</h1>
        <p style="color: #4a457a;">Актуальные результаты турнира</p>
    </div>

    <div class="admin-panel">
        <button id="refreshBtn" class="btn-primary">🔄 Обновить данные с сервера</button>
        <div id="status" class="status"></div>
        <p style="font-size: 0.7rem; margin-top: 8px; color:#5a5578;">Данные обновляются организатором турнира</p>
    </div>

    <div class="card">
        <div class="card-header">🏸 Мужской одиночный разряд · Групповой этап</div>
        <div class="card-body" id="maleGroupsContainer"></div>
    </div>
    <div class="card">
        <div class="card-header">🏆 Мужская олимпийская сетка · Плей-офф</div>
        <div class="card-body"><div id="maleBracket" class="bracket-container"></div></div>
    </div>

    <div class="card">
        <div class="card-header">🏸 Женский одиночный разряд · Групповой этап</div>
        <div class="card-body" id="femaleGroupsContainer"></div>
    </div>
    <div class="card">
        <div class="card-header">🥈 Женская олимпийская сетка · Плей-офф</div>
        <div class="card-body"><div id="femaleBracket" class="bracket-container"></div></div>
    </div>
</div>

<script>
    let maleGroups = [], femaleGroups = [], maleBracketStages = [], femaleBracketStages = [];
    let currentBinId = localStorage.getItem('mefi_bin_id') || null;
    
    function determineWinner(scoreStr) {
        if (!scoreStr) return null;
        let parts = scoreStr.split(',').map(s => s.trim());
        let p1Wins = 0, p2Wins = 0;
        for (let part of parts) {
            let s = part.split(':');
            if (s.length === 2) {
                if (parseInt(s[0]) > parseInt(s[1])) p1Wins++;
                else if (parseInt(s[1]) > parseInt(s[0])) p2Wins++;
            }
        }
        if (p1Wins > p2Wins) return 1;
        if (p2Wins > p1Wins) return 2;
        return null;
    }
    
    function calcStats(group) {
        return group.players.map((_, i) => {
            let wins = 0, diff = 0;
            for (let j = 0; j < group.players.length; j++) {
                if (i === j) continue;
                let score = group.scores[i]?.[j];
                if (score) {
                    if (determineWinner(score) === 1) wins++;
                    let myTotal = 0, oppTotal = 0;
                    score.split(',').forEach(p => {
                        let sc = p.split(':');
                        if (sc.length === 2) { myTotal += parseInt(sc[0])||0; oppTotal += parseInt(sc[1])||0; }
                    });
                    diff += myTotal - oppTotal;
                }
            }
            return { wins, diff, total: group.players.length - 1 };
        });
    }
    
    function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    
    function renderGroups(containerId, groups) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        groups.forEach(group => {
            const div = document.createElement('div');
            div.className = 'group-container';
            div.innerHTML = `<div class="group-title-bar">${escapeHtml(group.name)}</div>`;
            const wrapper = document.createElement('div');
            wrapper.className = 'table-wrapper';
            const table = document.createElement('table');
            table.className = 'tournament-table';
            const n = group.players.length;
            const stats = calcStats(group);
            let html = '<thead><tr><th>Игроки</th>';
            for (let i=0; i<n; i++) html += `<th>${escapeHtml(group.players[i])}</th>`;
            html += '<th>В/П</th><th>Разница</th></tr></thead><tbody>';
            for (let i=0; i<n; i++) {
                html += `<tr><td class="player-col">${escapeHtml(group.players[i])}</td>`;
                for (let j=0; j<n; j++) {
                    if (i===j) html += '<td>—</td>';
                    else {
                        let val = group.scores[i][j] || '';
                        let cls = determineWinner(val) === 1 ? 'win-cell' : '';
                        html += `<td class="${cls}">${escapeHtml(val)}</td>`;
                    }
                }
                html += `<td class="stats-col">${stats[i].wins}/${stats[i].total-stats[i].wins}</td>`;
                html += `<td class="stats-col">${stats[i].diff}</td></tr>`;
            }
            html += '</tbody>';
            table.innerHTML = html;
            wrapper.appendChild(table);
            div.appendChild(wrapper);
            container.appendChild(div);
        });
    }
    
    function renderBracket(containerId, bracketData) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        bracketData.forEach(stage => {
            const div = document.createElement('div');
            div.className = 'bracket-stage';
            div.innerHTML = `<div class="stage-title">${stage.name}</div><div class="matches-list"></div>`;
            const list = div.querySelector('.matches-list');
            stage.matches.forEach(match => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="match-players-row"><span>${escapeHtml(match.p1) || '—'}</span><span>⚡</span><span>${escapeHtml(match.p2) || '—'}</span></div>
                    <div class="match-score-row"><span>${escapeHtml(match.score) || '—'}</span></div>
                    <div class="winner-badge">${match.winner ? '✅ '+escapeHtml(match.winner) : '—'}</div>
                `;
                list.appendChild(card);
            });
            container.appendChild(div);
        });
    }
    
    function renderAll() {
        renderGroups('maleGroupsContainer', maleGroups);
        renderGroups('femaleGroupsContainer', femaleGroups);
        renderBracket('maleBracket', maleBracketStages);
        renderBracket('femaleBracket', femaleBracketStages);
    }
    
    function showStatus(msg, type) {
        let d = document.getElementById('status');
        d.innerHTML = msg;
        d.className = `status status-${type}`;
        setTimeout(() => { if(d) d.innerHTML = ''; }, 4000);
    }
    
    async function loadFromServer() {
        let id = localStorage.getItem('mefi_bin_id');
        if (!id) { showStatus('⚠️ Данные ещё не загружены организатором', 'error'); return; }
        showStatus('☁️ Загрузка...', 'success');
        try {
            let response = await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`, { headers: { 'X-Bin-Meta': 'false' } });
            if (response.ok) {
                let data = await response.json();
                if (data.maleGroups) maleGroups = data.maleGroups;
                if (data.femaleGroups) femaleGroups = data.femaleGroups;
                if (data.maleBracketStages) maleBracketStages = data.maleBracketStages;
                if (data.femaleBracketStages) femaleBracketStages = data.femaleBracketStages;
                renderAll();
                showStatus('✅ Данные обновлены!', 'success');
            } else throw new Error();
        } catch(e) { showStatus('❌ Ошибка загрузки', 'error'); }
    }
    
    document.getElementById('refreshBtn').onclick = loadFromServer;
    renderAll();
    loadFromServer();
</script>
</body>
</html>
