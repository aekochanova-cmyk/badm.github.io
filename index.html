<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Первенство МИФИ | Турнир</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #bfbfdb; padding: 20px 12px 40px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); margin-bottom: 28px; overflow: hidden; }
        .card-header { background: #0b0829; color: white; padding: 16px 20px; font-size: 1.3rem; font-weight: 700; }
        .card-body { padding: 20px; }
        .group-container { background: #fefefe; border-radius: 24px; margin-bottom: 30px; border: 1px solid #e0ddf5; }
        .group-title-bar { background: #eae9fc; padding: 12px 20px; font-weight: 700; font-size: 1.1rem; }
        .table-wrapper { overflow-x: auto; padding: 16px; }
        .tournament-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 500px; }
        .tournament-table th, .tournament-table td { border: 1px solid #d4d4e0; padding: 10px 8px; text-align: center; }
        .tournament-table th { background: #f5f4ff; font-weight: 700; }
        .player-col { font-weight: 700; background: #faf9ff; text-align: left !important; }
        .win-cell { background-color: #c8f0d1 !important; }
        .stats-col { background: #f5f3ff; font-weight: 600; }
        .bracket-container { display: flex; flex-direction: column; gap: 24px; }
        .bracket-stage { background: #faf9ff; border-radius: 24px; padding: 16px; }
        .stage-title { font-weight: 800; margin-bottom: 16px; padding-left: 12px; border-left: 4px solid #0b0829; }
        .matches-list { display: flex; flex-direction: column; gap: 16px; }
        .match-card { background: white; border-radius: 20px; padding: 14px; border: 1px solid #e2defc; }
        .match-players-row { display: flex; gap: 12px; justify-content: space-between; margin-bottom: 10px; }
        .match-players-row span { flex: 1; text-align: center; font-weight: 600; }
        .match-score-row span { display: block; text-align: center; background: #f1efff; padding: 8px; border-radius: 30px; font-family: monospace; }
        .winner-badge { background: #0b0829; color: white; padding: 6px; border-radius: 40px; text-align: center; font-size: 0.75rem; }
        .refresh-panel { background: #f8f7fc; border-radius: 32px; padding: 18px; margin-bottom: 24px; border: 2px solid #cbc8e0; text-align: center; }
        .btn-primary { background: #0b0829; color: white; border: none; padding: 10px 24px; border-radius: 40px; font-weight: bold; cursor: pointer; }
        .status { font-size: 0.75rem; margin-top: 10px; padding: 6px; border-radius: 30px; }
        .status-success { background: #d4e0b2; color: #2b6e3c; }
        .status-error { background: #f0d6d6; color: #b91c1c; }
        .last-update { font-size: 0.7rem; color: #5a5578; margin-top: 8px; }
        @media (min-width: 768px) { .bracket-container { flex-direction: row; flex-wrap: wrap; } .bracket-stage { flex: 1; } }
    </style>
</head>
<body>
<div class="container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="font-size: 2.2rem; background: linear-gradient(135deg,#0b0829,#413a7c); background-clip: text; -webkit-background-clip: text; color: transparent;">🏸 Первенство МИФИ</h1>
        <p style="color: #4a457a;">Актуальные результаты турнира</p>
    </div>

    <div class="refresh-panel">
        <button id="refreshBtn" class="btn-primary">🔄 Обновить данные</button>
        <div id="status" class="status"></div>
        <div id="lastUpdate" class="last-update"></div>
    </div>

    <div class="card"><div class="card-header">🏸 Мужской одиночный разряд · Групповой этап</div><div class="card-body" id="maleGroupsContainer"></div></div>
    <div class="card"><div class="card-header">🏆 Мужская олимпийская сетка · Плей-офф</div><div class="card-body"><div id="maleBracket" class="bracket-container"></div></div></div>
    <div class="card"><div class="card-header">🏸 Женский одиночный разряд · Групповой этап</div><div class="card-body" id="femaleGroupsContainer"></div></div>
    <div class="card"><div class="card-header">🥈 Женская олимпийская сетка · Плей-офф</div><div class="card-body"><div id="femaleBracket" class="bracket-container"></div></div></div>
</div>

<script>
    let maleGroups=[], femaleGroups=[], maleBracketStages=[], femaleBracketStages=[];
    const BIN_ID_KEY='mefi_bin_id';
    function determineWinner(s){ if(!s) return null; let p=s.split(',').map(t=>t.trim()), p1=0,p2=0; for(let t of p){ let a=t.split(':'); if(a.length===2){ if(parseInt(a[0])>parseInt(a[1])) p1++; else if(parseInt(a[1])>parseInt(a[0])) p2++; } } if(p1>p2) return 1; if(p2>p1) return 2; return null; }
    function calcStats(g){ if(!g.players) return []; return g.players.map((_,i)=>{ let w=0,d=0; for(let j=0;j<g.players.length;j++){ if(i===j) continue; let sc=g.scores[i]?.[j]; if(sc){ if(determineWinner(sc)===1) w++; let my=0,opp=0; sc.split(',').forEach(p=>{ let a=p.split(':'); if(a.length===2){ my+=parseInt(a[0])||0; opp+=parseInt(a[1])||0; } }); d+=my-opp; } } return { wins:w, diff:d, total:g.players.length-1 }; }); }
    function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function renderGroups(cid, groups){ let c=document.getElementById(cid); if(!c) return; c.innerHTML=''; groups.forEach(g=>{ let div=document.createElement('div'); div.className='group-container'; div.innerHTML=`<div class="group-title-bar">${escapeHtml(g.name)}</div>`; let w=document.createElement('div'); w.className='table-wrapper'; let t=document.createElement('table'); t.className='tournament-table'; let n=g.players.length, stats=calcStats(g); let html='<thead><tr><th>Игроки</th>'; for(let i=0;i<n;i++) html+=`<th>${escapeHtml(g.players[i])}</th>`; html+='<th>В/П</th><th>Разница</th></tr></thead><tbody>'; for(let i=0;i<n;i++){ html+=`<tr><td class="player-col">${escapeHtml(g.players[i])}</td>`; for(let j=0;j<n;j++){ if(i===j) html+='<td>—</td>'; else{ let val=g.scores[i][j]||''; let cls=determineWinner(val)===1?'win-cell':''; html+=`<td class="${cls}">${escapeHtml(val)}</td>`; } } html+=`<td class="stats-col">${stats[i].wins}/${stats[i].total-stats[i].wins}</td><td class="stats-col">${stats[i].diff}</td></tr>`; } html+='</tbody>'; t.innerHTML=html; w.appendChild(t); div.appendChild(w); c.appendChild(div); }); }
    function renderBracket(cid, data){ let c=document.getElementById(cid); if(!c) return; c.innerHTML=''; data.forEach(stage=>{ let d=document.createElement('div'); d.className='bracket-stage'; d.innerHTML=`<div class="stage-title">${stage.name}</div><div class="matches-list"></div>`; let list=d.querySelector('.matches-list'); stage.matches.forEach(m=>{ let card=document.createElement('div'); card.className='match-card'; card.innerHTML=`<div class="match-players-row"><span>${escapeHtml(m.p1)||'—'}</span><span>⚡</span><span>${escapeHtml(m.p2)||'—'}</span></div><div class="match-score-row"><span>${escapeHtml(m.score)||'—'}</span></div><div class="winner-badge">${m.winner?'✅ '+escapeHtml(m.winner):'—'}</div>`; list.appendChild(card); }); c.appendChild(d); }); }
    function renderAll(){ renderGroups('maleGroupsContainer',maleGroups); renderGroups('femaleGroupsContainer',femaleGroups); renderBracket('maleBracket',maleBracketStages); renderBracket('femaleBracket',femaleBracketStages); }
    function showStatus(msg,type){ let d=document.getElementById('status'); d.innerHTML=msg; d.className=`status status-${type}`; setTimeout(()=>{ if(d) d.innerHTML=''; },4000); }
    async function loadFromCloud(){ let id=localStorage.getItem(BIN_ID_KEY); if(!id){ showStatus('⚠️ Организатор ещё не опубликовал данные','error'); return; } showStatus('☁️ Загрузка...','success'); try{ let r=await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`,{headers:{'X-Bin-Meta':'false'}}); if(r.ok){ let data=await r.json(); if(data.maleGroups) maleGroups=data.maleGroups; if(data.femaleGroups) femaleGroups=data.femaleGroups; if(data.maleBracketStages) maleBracketStages=data.maleBracketStages; if(data.femaleBracketStages) femaleBracketStages=data.femaleBracketStages; renderAll(); if(data.lastUpdate) document.getElementById('lastUpdate').innerHTML=`Последнее обновление: ${data.lastUpdate}`; showStatus('✅ Данные обновлены!','success'); } else throw new Error(); } catch(e){ showStatus('❌ Ошибка загрузки','error'); } }
    document.getElementById('refreshBtn').onclick=loadFromCloud;
    renderAll(); loadFromCloud();
</script>
</body>
</html>
