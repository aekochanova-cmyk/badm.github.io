<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Первенство МИФИ </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            background: #bfbfdb;
            min-height: 100vh;
            padding: 16px 12px 40px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            margin-bottom: 28px;
            overflow: hidden;
        }
        .card-header {
            background: #0b0829;
            color: white;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-body {
            padding: 20px;
        }

        .group-container {
            background: #fefefe;
            border-radius: 24px;
            margin-bottom: 30px;
            border: 1px solid #e0ddf5;
            overflow: hidden;
        }
        .group-title-bar {
            background: #eae9fc;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .group-title-bar input {
            font-size: 1rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 40px;
            border: 1px solid #cbc8e0;
            background: white;
        }
        .table-wrapper {
            overflow-x: auto;
            padding: 16px;
        }
        .tournament-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 500px;
            background: white;
        }
        .tournament-table th, .tournament-table td {
            border: 1px solid #d4d4e0;
            padding: 10px 8px;
            text-align: center;
            vertical-align: middle;
        }
        .tournament-table th {
            background: #f5f4ff;
            font-weight: 700;
        }
        .player-col {
            font-weight: 700;
            background: #faf9ff;
            text-align: left !important;
            min-width: 120px;
        }
        .win-cell {
            background-color: #c8f0d1 !important;
        }
        .stats-col {
            background: #f5f3ff;
            font-weight: 600;
        }
        .editable-input {
            width: 100%;
            padding: 6px 4px;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            font-size: 0.75rem;
            font-family: monospace;
            text-align: center;
            background: white;
        }
        .player-input {
            font-weight: 600;
            background: #fffef5;
            font-family: inherit;
        }
        .delete-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 8px;
            color: #b91c1c;
        }
        .btn-icon {
            background: #f0eef5;
            border: none;
            border-radius: 40px;
            padding: 6px 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-primary {
            background: #0b0829;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-secondary {
            background: #4a3f7a;
            color: white;
        }
        .btn-green {
            background: #2b6e3c;
        }
        .btn-blue {
            background: #1e5a8a;
        }
        .bracket-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .bracket-stage {
            background: #faf9ff;
            border-radius: 24px;
            padding: 16px;
        }
        .stage-title {
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 16px;
            padding-left: 12px;
            border-left: 4px solid #0b0829;
        }
        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .match-card {
            background: white;
            border-radius: 20px;
            padding: 14px;
            border: 1px solid #e2defc;
        }
        .match-players-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .match-players-row input, .match-players-row span {
            flex: 1;
            text-align: center;
            font-weight: 600;
        }
        .match-score-row {
            margin: 8px 0;
        }
        .match-score-row input, .match-score-row span {
            width: 100%;
            text-align: center;
            background: #f1efff;
            padding: 8px;
            border-radius: 30px;
            font-family: monospace;
        }
        .winner-badge {
            background: #0b0829;
            color: white;
            padding: 6px;
            border-radius: 40px;
            text-align: center;
            font-size: 0.75rem;
            display: block;
        }
        .control-panel {
            background: #f8f7fc;
            border-radius: 32px;
            padding: 18px;
            margin-bottom: 24px;
            border: 2px solid #cbc8e0;
        }
        .admin-area {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .code-input {
            padding: 10px 16px;
            border-radius: 40px;
            border: 2px solid #cbc8e0;
            font-family: monospace;
            flex: 2;
            min-width: 180px;
        }
        .mode-badge {
            background: #e0ddf5;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .server-status {
            font-size: 0.75rem;
            margin-top: 10px;
            text-align: center;
            padding: 6px;
            border-radius: 30px;
        }
        .status-success { background: #d4e0b2; color: #2b6e3c; }
        .status-error { background: #f0d6d6; color: #b91c1c; }
        .status-info { background: #e0ddf5; color: #4a3f7a; }
        @media (min-width: 768px) {
            .bracket-container { flex-direction: row; flex-wrap: wrap; }
            .bracket-stage { flex: 1; min-width: 260px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="font-size: 2.2rem; background: linear-gradient(135deg,#0b0829,#413a7c); background-clip: text; -webkit-background-clip: text; color: transparent;">Первенство МИФИ</h1
    </div>

    <div class="control-panel">
        <div class="admin-area">
            <div><span id="modeBadge" class="mode-badge">🔒 Режим просмотра</span></div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="adminCodeInput" class="code-input" placeholder="" autocomplete="off">
                <button id="unlockBtn" class="btn-primary">🔓 Активировать</button>
                <button id="lockBtn" class="btn-primary" style="background:#6c5b7b; display:none;">🔒 Закрыть</button>
            </div>
        </div>
        <div id="saveTools" style="display: none; margin-top: 16px;">
            <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
                <button id="saveToServerBtn" class="btn-primary btn-green">☁️ Сохранить на сервер</button>
                <button id="loadFromServerBtn" class="btn-primary btn-blue">⬇️ Загрузить с сервера</button>
                <button id="resetDataBtn" class="btn-primary" style="background:#8b5e3c;">⟳ Сбросить всё</button>
            </div>
            <div id="serverStatus" class="server-status"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span>🏸 Мужской одиночный разряд · Групповой этап</span>
            <div id="maleGroupActions" style="display: none;">
                <button id="addMaleGroupBtn" class="btn-primary btn-secondary btn-green">➕ Добавить группу</button>
            </div>
        </div>
        <div class="card-body" id="maleGroupsContainer"></div>
    </div>

    <div class="card">
        <div class="card-header">
            <span>🏆 Мужская олимпийская сетка · Плей-офф</span>
            <div id="maleBracketActions" style="display: none;">
                <button id="addMaleMatchBtn" class="btn-primary btn-secondary">➕ Добавить матч</button>
            </div>
        </div>
        <div class="card-body">
            <div id="maleBracket" class="bracket-container"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span>🏸 Женский одиночный разряд · Групповой этап</span>
            <div id="femaleGroupActions" style="display: none;">
                <button id="addFemaleGroupBtn" class="btn-primary btn-secondary btn-green">➕ Добавить группу</button>
            </div>
        </div>
        <div class="card-body" id="femaleGroupsContainer"></div>
    </div>

    <div class="card">
        <div class="card-header">
            <span>🥈 Женская олимпийская сетка · Плей-офф</span>
            <div id="femaleBracketActions" style="display: none;">
                <button id="addFemaleMatchBtn" class="btn-primary btn-secondary">➕ Добавить матч</button>
            </div>
        </div>
        <div class="card-body">
            <div id="femaleBracket" class="bracket-container"></div>
        </div>
    </div>
</div>

<script>
    // ========== НАСТРОЙКИ API ==========
    // Бесплатный публичный API для демонстрации (данные хранятся 24 часа)
    // Для постоянного использования зарегистрируйтесь на mockapi.io и замените URL
    const API_BASE = 'https://672f54e7229a881691ef1e50.mockapi.io/api/v1';
    const STORAGE_ID = 'mefi_tournament';
    
    // ========== ГЛОБАЛЬНЫЕ ДАННЫЕ ==========
    let maleGroups = [];
    let femaleGroups = [];
    let maleBracketStages = [];
    let femaleBracketStages = [];
    let isEditMode = false;
    let currentRecordId = null;

    // ========== ПРАВИЛЬНЫЙ ПОДСЧЁТ ПОБЕД (по партиям, как на сайте) ==========
    function determineWinnerFromScore(scoreStr) {
        if (!scoreStr || scoreStr.trim() === "") return null;
        let parts = scoreStr.split(',').map(s => s.trim());
        let player1Wins = 0;
        let player2Wins = 0;
        for (let part of parts) {
            let scores = part.split(':');
            if (scores.length === 2) {
                let s1 = parseInt(scores[0]);
                let s2 = parseInt(scores[1]);
                if (s1 > s2) player1Wins++;
                else if (s2 > s1) player2Wins++;
            }
        }
        if (player1Wins > player2Wins) return 1;
        if (player2Wins > player1Wins) return 2;
        return null;
    }

    function calcGroupStats(group) {
        let n = group.players.length;
        let stats = [];
        for (let i = 0; i < n; i++) {
            let wins = 0, pointsDiff = 0;
            for (let j = 0; j < n; j++) {
                if (i === j) continue;
                let score = group.scores[i][j];
                if (score && score.trim() !== "") {
                    let winner = determineWinnerFromScore(score);
                    if (winner === 1) wins++;
                    let myTotal = 0, oppTotal = 0;
                    let parts = score.split(',').map(s => s.trim());
                    parts.forEach(p => {
                        let sc = p.split(':');
                        if (sc.length === 2) {
                            myTotal += parseInt(sc[0])||0;
                            oppTotal += parseInt(sc[1])||0;
                        }
                    });
                    pointsDiff += (myTotal - oppTotal);
                }
            }
            stats.push({ wins, pointsDiff, totalGames: n-1 });
        }
        return stats;
    }

    // ========== ОСТАЛЬНЫЕ ФУНКЦИИ ==========
    function createEmptyGroup(defaultName = "Новая группа") {
        return { name: defaultName, players: [], scores: [] };
    }

    function addPlayerToGroup(group, playerName = "Игрок") {
        group.players.push(playerName);
        group.scores.forEach(row => row.push(''));
        group.scores.push(Array(group.players.length).fill(''));
        for(let i = 0; i < group.players.length; i++) group.scores[i][i] = '';
    }

    function removePlayerFromGroup(group, playerIndex) {
        group.players.splice(playerIndex, 1);
        group.scores.splice(playerIndex, 1);
        for(let i = 0; i < group.scores.length; i++) group.scores[i].splice(playerIndex, 1);
    }

    function initBracket(matchesPerStage = 3) {
        return [
            { name: "Четвертьфиналы", matches: [] },
            { name: "Полуфиналы", matches: [] },
            { name: "Финал / Матч за 3 место", matches: [] }
        ].map((stage, idx) => {
            let matchCount = idx === 0 ? matchesPerStage : (idx === 1 ? Math.max(1, Math.ceil(matchesPerStage / 2)) : 1);
            let matches = [];
            for (let i = 0; i < matchCount; i++) matches.push({ p1: "", p2: "", score: "", winner: "" });
            return { name: stage.name, matches };
        });
    }

    // ========== РЕНДЕРИНГ ТАБЛИЦ (с правильной подсветкой побед) ==========
    function renderGroup(group, containerId, groupIdx, isMale) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const groupDiv = document.createElement('div');
        groupDiv.className = 'group-container';
        const titleBar = document.createElement('div');
        titleBar.className = 'group-title-bar';
        if (isEditMode) {
            let nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.value = group.name;
            nameInput.addEventListener('change', (e) => { group.name = e.target.value; renderAllGroups(); });
            titleBar.appendChild(nameInput);
        } else {
            let titleSpan = document.createElement('span');
            titleSpan.textContent = group.name;
            titleBar.appendChild(titleSpan);
        }
        let btnGroup = document.createElement('div');
        if (isEditMode) {
            let addPlayerBtn = document.createElement('button');
            addPlayerBtn.textContent = '+ Игрок';
            addPlayerBtn.className = 'btn-icon';
            addPlayerBtn.onclick = () => { addPlayerToGroup(group, `Новый`); renderAllGroups(); };
            let delGroupBtn = document.createElement('button');
            delGroupBtn.textContent = '🗑 Удалить группу';
            delGroupBtn.className = 'btn-icon';
            delGroupBtn.style.background = '#f0d6d6';
            delGroupBtn.onclick = () => {
                if(isMale) maleGroups.splice(groupIdx,1);
                else femaleGroups.splice(groupIdx,1);
                renderAllGroups();
            };
            btnGroup.appendChild(addPlayerBtn);
            btnGroup.appendChild(delGroupBtn);
        }
        titleBar.appendChild(btnGroup);
        groupDiv.appendChild(titleBar);
        
        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'table-wrapper';
        const table = document.createElement('table');
        table.className = 'tournament-table';
        const n = group.players.length;
        const stats = calcGroupStats(group);
        
        let thead = document.createElement('thead');
        let headerRow = document.createElement('tr');
        headerRow.appendChild(document.createElement('th')).textContent = "Игроки";
        for (let i = 0; i < n; i++) {
            let th = document.createElement('th');
            if (isEditMode) {
                let inp = document.createElement('input');
                inp.type = 'text';
                inp.value = group.players[i];
                inp.className = 'editable-input player-input';
                inp.addEventListener('change', (e) => { group.players[i] = e.target.value; renderAllGroups(); });
                th.appendChild(inp);
            } else th.textContent = group.players[i];
            headerRow.appendChild(th);
        }
        headerRow.appendChild(document.createElement('th')).textContent = "В/П";
        headerRow.appendChild(document.createElement('th')).textContent = "Разница";
        if (isEditMode) headerRow.appendChild(document.createElement('th')).textContent = "🗑";
        thead.appendChild(headerRow);
        table.appendChild(thead);
        
        let tbody = document.createElement('tbody');
        for (let i = 0; i < n; i++) {
            let tr = document.createElement('tr');
            let nameCell = document.createElement('td');
            nameCell.className = 'player-col';
            if (isEditMode) {
                let inp = document.createElement('input');
                inp.type = 'text';
                inp.value = group.players[i];
                inp.className = 'editable-input player-input';
                inp.addEventListener('change', (e) => { group.players[i] = e.target.value; renderAllGroups(); });
                nameCell.appendChild(inp);
            } else nameCell.textContent = group.players[i];
            tr.appendChild(nameCell);
            for (let j = 0; j < n; j++) {
                let td = document.createElement('td');
                if (i === j) td.textContent = "—";
                else {
                    let scoreVal = group.scores[i][j] || '';
                    if (isEditMode) {
                        let inp = document.createElement('input');
                        inp.type = 'text';
                        inp.value = scoreVal;
                        inp.className = 'editable-input score-cell';
                        inp.placeholder = "21:15, 20:22, 21:10";
                        inp.addEventListener('change', (e) => { group.scores[i][j] = e.target.value; renderAllGroups(); });
                        td.appendChild(inp);
                    } else {
                        td.textContent = scoreVal;
                        if (scoreVal) {
                            let winner = determineWinnerFromScore(scoreVal);
                            if (winner === 1) td.classList.add('win-cell');
                        }
                    }
                }
                tr.appendChild(td);
            }
            let statsTd = document.createElement('td'); statsTd.className = 'stats-col';
            statsTd.textContent = `${stats[i].wins} / ${stats[i].totalGames - stats[i].wins}`;
            let diffTd = document.createElement('td'); diffTd.className = 'stats-col';
            diffTd.textContent = stats[i].pointsDiff;
            tr.appendChild(statsTd);
            tr.appendChild(diffTd);
            if (isEditMode) {
                let delTd = document.createElement('td');
                let delBtn = document.createElement('button');
                delBtn.textContent = '✖';
                delBtn.className = 'delete-btn';
                delBtn.onclick = () => { removePlayerFromGroup(group, i); renderAllGroups(); };
                delTd.appendChild(delBtn);
                tr.appendChild(delTd);
            }
            tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        tableWrapper.appendChild(table);
        groupDiv.appendChild(tableWrapper);
        container.appendChild(groupDiv);
    }

    function renderBracket(containerId, bracketData) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        bracketData.forEach((stage, stageIdx) => {
            const stageDiv = document.createElement('div');
            stageDiv.className = 'bracket-stage';
            stageDiv.innerHTML = `<div class="stage-title">${stage.name}</div><div class="matches-list" id="matches-${containerId}-${stageIdx}"></div>`;
            container.appendChild(stageDiv);
            const matchesContainer = stageDiv.querySelector('.matches-list');
            stage.matches.forEach((match, matchIdx) => {
                const matchCard = document.createElement('div');
                matchCard.className = 'match-card';
                if (isEditMode) {
                    matchCard.innerHTML = `
                        <div class="match-players-row">
                            <input type="text" placeholder="Игрок 1" value="${escapeHtml(match.p1)}" data-stage="${stageIdx}" data-match="${matchIdx}" data-field="p1">
                            <span>vs</span>
                            <input type="text" placeholder="Игрок 2" value="${escapeHtml(match.p2)}" data-stage="${stageIdx}" data-match="${matchIdx}" data-field="p2">
                        </div>
                        <div class="match-score-row">
                            <input type="text" placeholder="Счёт (21:15, 18:21, 21:10)" value="${escapeHtml(match.score)}" data-stage="${stageIdx}" data-match="${matchIdx}" data-field="score">
                        </div>
                        <div class="winner-row">
                            <input type="text" placeholder="Победитель" value="${escapeHtml(match.winner)}" data-stage="${stageIdx}" data-match="${matchIdx}" data-field="winner" style="width:100%; padding:8px; border-radius:30px;">
                        </div>
                        <button class="delete-btn" data-del-stage="${stageIdx}" data-del-match="${matchIdx}">🗑 Удалить матч</button>
                    `;
                } else {
                    matchCard.innerHTML = `
                        <div class="match-players-row"><span>${escapeHtml(match.p1) || '—'}</span> <span>⚡</span> <span>${escapeHtml(match.p2) || '—'}</span></div>
                        <div class="match-score-row"><span>${escapeHtml(match.score) || '—'}</span></div>
                        <div class="winner-row"><div class="winner-badge">${match.winner ? '✅ '+escapeHtml(match.winner) : '—'}</div></div>
                    `;
                }
                matchesContainer.appendChild(matchCard);
            });
            if (isEditMode) {
                let addBtn = document.createElement('button');
                addBtn.textContent = '+ Добавить матч';
                addBtn.style.marginTop = '12px';
                addBtn.style.background = '#eae5fc';
                addBtn.style.border = 'none';
                addBtn.style.borderRadius = '40px';
                addBtn.style.padding = '8px';
                addBtn.style.fontWeight = '600';
                addBtn.onclick = () => { bracketData[stageIdx].matches.push({ p1:"", p2:"", score:"", winner:"" }); renderBracket(containerId, bracketData); };
                stageDiv.appendChild(addBtn);
            }
        });
        if (isEditMode) {
            document.querySelectorAll(`#${containerId} input[data-stage]`).forEach(inp => {
                inp.addEventListener('change', (e) => {
                    let stage = parseInt(inp.dataset.stage);
                    let match = parseInt(inp.dataset.match);
                    let field = inp.dataset.field;
                    if (bracketData[stage] && bracketData[stage].matches[match]) bracketData[stage].matches[match][field] = inp.value;
                });
            });
            document.querySelectorAll(`#${containerId} button[data-del-stage]`).forEach(btn => {
                btn.addEventListener('click', (e) => {
                    let stage = parseInt(btn.dataset.delStage);
                    let match = parseInt(btn.dataset.delMatch);
                    if (bracketData[stage]) bracketData[stage].matches.splice(match,1);
                    renderBracket(containerId, bracketData);
                });
            });
        }
    }

    function renderAllGroups() {
        const maleContainer = document.getElementById('maleGroupsContainer');
        const femaleContainer = document.getElementById('femaleGroupsContainer');
        maleContainer.innerHTML = '';
        femaleContainer.innerHTML = '';
        maleGroups.forEach((g, idx) => renderGroup(g, 'maleGroupsContainer', idx, true));
        femaleGroups.forEach((g, idx) => renderGroup(g, 'femaleGroupsContainer', idx, false));
    }

    function refreshAll() {
        renderAllGroups();
        renderBracket('maleBracket', maleBracketStages);
        renderBracket('femaleBracket', femaleBracketStages);
    }

    function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

    function addGroup(isMale) {
        let newGroup = createEmptyGroup(`Группа ${(isMale ? maleGroups.length+1 : femaleGroups.length+1)}`);
        if (isMale) maleGroups.push(newGroup);
        else femaleGroups.push(newGroup);
        renderAllGroups();
    }

    function addMatchToBracket(isMale) {
        let bracket = isMale ? maleBracketStages : femaleBracketStages;
        if (bracket[0]) bracket[0].matches.push({ p1:"", p2:"", score:"", winner:"" });
        refreshAll();
    }

    // ========== ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ ==========
    function showStatus(message, type = 'info') {
        const statusDiv = document.getElementById('serverStatus');
        if (statusDiv) {
            statusDiv.innerHTML = message;
            statusDiv.className = `server-status status-${type}`;
            setTimeout(() => { if(statusDiv) statusDiv.innerHTML = ''; }, 4000);
        }
    }

    async function saveToServer() {
        showStatus('📤 Отправка на сервер...', 'info');
        const data = { maleGroups, femaleGroups, maleBracketStages, femaleBracketStages };
        try {
            let response;
            if (currentRecordId) {
                response = await fetch(`${API_BASE}/${STORAGE_ID}/${currentRecordId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } else {
                response = await fetch(`${API_BASE}/${STORAGE_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            }
            if (response.ok) {
                const result = await response.json();
                currentRecordId = result.id;
                showStatus('✅ Данные сохранены на сервере! Теперь доступны на любом устройстве.', 'success');
            } else throw new Error();
        } catch(e) {
            showStatus('❌ Ошибка сохранения. Попробуйте позже.', 'error');
        }
    }

    async function loadFromServer() {
        showStatus('📥 Загрузка с сервера...', 'info');
        try {
            const response = await fetch(`${API_BASE}/${STORAGE_ID}`);
            if (response.ok) {
                const allRecords = await response.json();
                if (allRecords && allRecords.length > 0) {
                    const latest = allRecords[allRecords.length - 1];
                    currentRecordId = latest.id;
                    maleGroups = latest.maleGroups || [];
                    femaleGroups = latest.femaleGroups || [];
                    maleBracketStages = latest.maleBracketStages || initBracket(3);
                    femaleBracketStages = latest.femaleBracketStages || initBracket(3);
                    refreshAll();
                    showStatus('✅ Данные загружены с сервера!', 'success');
                } else {
                    showStatus('⚠️ На сервере пока нет данных. Сначала сохраните.', 'error');
                }
            } else throw new Error();
        } catch(e) {
            showStatus('❌ Ошибка загрузки. Проверьте интернет.', 'error');
        }
    }

    function resetData() {
        if(confirm('Очистить все данные локально?')) {
            maleGroups = [];
            femaleGroups = [];
            maleBracketStages = initBracket(3);
            femaleBracketStages = initBracket(3);
            refreshAll();
            showStatus('🔄 Локальные данные очищены', 'info');
        }
    }

    function setEditMode(enable) {
        isEditMode = enable;
        const modeSpan = document.getElementById('modeBadge');
        const unlockBtn = document.getElementById('unlockBtn');
        const lockBtn = document.getElementById('lockBtn');
        const saveTools = document.getElementById('saveTools');
        const maleGroupActions = document.getElementById('maleGroupActions');
        const femaleGroupActions = document.getElementById('femaleGroupActions');
        const maleBracketActions = document.getElementById('maleBracketActions');
        const femaleBracketActions = document.getElementById('femaleBracketActions');
        
        if(enable) {
            modeSpan.innerHTML = '✏️ РЕЖИМ РЕДАКТИРОВАНИЯ';
            modeSpan.style.background = '#d4e0b2';
            unlockBtn.style.display = 'none';
            lockBtn.style.display = 'inline-block';
            saveTools.style.display = 'block';
            maleGroupActions.style.display = 'block';
            femaleGroupActions.style.display = 'block';
            maleBracketActions.style.display = 'block';
            femaleBracketActions.style.display = 'block';
        } else {
            modeSpan.innerHTML = '🔒 Режим просмотра';
            modeSpan.style.background = '#e0ddf5';
            unlockBtn.style.display = 'inline-block';
            lockBtn.style.display = 'none';
            saveTools.style.display = 'none';
            maleGroupActions.style.display = 'none';
            femaleGroupActions.style.display = 'none';
            maleBracketActions.style.display = 'none';
            femaleBracketActions.style.display = 'none';
        }
        refreshAll();
    }

    function initDefault() {
        maleGroups = [];
        femaleGroups = [];
        let demoGroup = createEmptyGroup("Мужчины · Группа A");
        addPlayerToGroup(demoGroup, "Иванов");
        addPlayerToGroup(demoGroup, "Петров");
        addPlayerToGroup(demoGroup, "Сидоров");
        maleGroups.push(demoGroup);
        let demoFemale = createEmptyGroup("Женщины · Группа A");
        addPlayerToGroup(demoFemale, "Смирнова");
        addPlayerToGroup(demoFemale, "Кузнецова");
        femaleGroups.push(demoFemale);
        maleBracketStages = initBracket(3);
        femaleBracketStages = initBracket(3);
        refreshAll();
    }

    // Обработчики
    document.getElementById('addMaleGroupBtn').addEventListener('click', () => addGroup(true));
    document.getElementById('addFemaleGroupBtn').addEventListener('click', () => addGroup(false));
    document.getElementById('addMaleMatchBtn').addEventListener('click', () => addMatchToBracket(true));
    document.getElementById('addFemaleMatchBtn').addEventListener('click', () => addMatchToBracket(false));
    document.getElementById('unlockBtn').addEventListener('click', () => {
        if(document.getElementById('adminCodeInput').value.trim() === 'BDMEPHI2026') setEditMode(true);
        else alert('Неверный код');
    });
    document.getElementById('lockBtn').addEventListener('click', () => setEditMode(false));
    document.getElementById('saveToServerBtn').addEventListener('click', saveToServer);
    document.getElementById('loadFromServerBtn').addEventListener('click', loadFromServer);
    document.getElementById('resetDataBtn').addEventListener('click', resetData);
    
    initDefault();
    setEditMode(false);
</script>
</body>
</html>
