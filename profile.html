<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Volanchiki</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #bfbfdb; min-height: 100vh; }
        .navbar { background: rgba(255,255,255,0.95); padding: 1rem 0; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; flex-wrap: wrap; }
        .logo-link img { max-width: 100%; height: auto; width: 300px; }
        .nav-menu { display: flex; list-style: none; gap: 2rem; align-items: center; flex-wrap: wrap; }
        .nav-menu a { text-decoration: none; color: #0b0829; font-weight: 500; font-size: 18px; }
        .nav-menu a:hover { color: #667eea; }
        .dropdown { position: relative; }
        .dropdown-menu { position: absolute; top: 100%; left: 0; background: white; min-width: 200px; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.3s ease; z-index: 9999; padding: 0.5rem 0; }
        .dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-menu a { padding: 0.6rem 1.5rem; display: block; color: #333; font-size: 16px; }
        .dropdown-menu a:hover { background: #bfbfdb; padding-left: 2rem; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 20px; display: grid; grid-template-columns: 280px 1fr; gap: 30px; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .profile-card { text-align: center; height: fit-content; }
        .avatar { width: 100px; height: 100px; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 40px; color: white; }
        .name { font-size: 22px; font-weight: bold; }
        .nick { color: #666; margin-bottom: 15px; }
        .rating-box { background: #f8f9fa; padding: 12px; border-radius: 10px; margin: 10px 0; }
        .rating-val { font-size: 28px; font-weight: bold; color: #667eea; }
        .section-card { margin-bottom: 20px; }
        .section-title { font-size: 20px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #eee; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f8f9fa; }
        tr:hover { background: #f0f0f0; }
        .badge { padding: 4px 10px; border-radius: 15px; font-size: 12px; }
        .badge-ok { background: #e8f5e9; color: #2e7d32; }
        .badge-wait { background: #fff3e0; color: #ef6c00; }
        .positive { color: #2e7d32; font-weight: bold; }
        .negative { color: #c62828; font-weight: bold; }
        .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; color: white; margin-top: 10px; }
        .btn-danger { background: #dc3545; }
        .btn-main { background: #667eea; }
        footer { margin-top: 30px; padding: 20px; border-top: 1px solid #eee; text-align: center; }
        footer a { text-decoration: none; color: #333; font-weight: bold; margin: 0 15px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } .nav-container { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="Glavnay.html" class="logo-link"><img src="logo.jpg" alt="Логотип" width="400" height="150"></a>
        <ul class="nav-menu">
            <li><a href="Glavnay.html">Главная</a></li>
            <li><a href="Kalendar.html">Календарь</a></li>
            <li class="dropdown"><a href="#">Игроки ▾</a><div class="dropdown-menu"><a href="ОдинИгрок.html">😎 Одиночный</a><a href="ПарИгрок.html">👭 Парный</a></div></li>
            <li class="dropdown"><a href="#">Информация ▾</a><div class="dropdown-menu"><a href="Ychastnikam.html">🏸 Участникам</a><a href="Organizatoram.html">📋 Организаторам</a></div></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="card profile-card">
        <div class="avatar">🏸</div>
        <div class="name" id="uname">Загрузка...</div>
        <div class="nick" id="unick"></div>
        <div class="rating-box"><div style="color:#666;">Одиночный</div><div class="rating-val" id="sr">—</div></div>
        <div class="rating-box"><div style="color:#666;">Парный</div><div class="rating-val" id="dr">—</div></div>
        <button class="btn btn-main" onclick="location.href='Kalendar.html'">📝 На турниры</button>
        <button class="btn btn-danger" onclick="logout()">🚪 Выйти</button>
    </div>
    <div>
        <div class="card section-card"><div class="section-title">🏆 Мои регистрации</div><table><thead><tr><th>Турнир</th><th>Дата</th><th>Разряд</th><th>Статус</th></tr></thead><tbody id="regs"><tr><td colspan="4" style="text-align:center;">Загрузка...</td></tr></tbody></table></div>
        <div class="card section-card"><div class="section-title">📊 История рейтинга</div><table><thead><tr><th>Дата</th><th>Турнир</th><th>Было</th><th>Стало</th><th>Изм.</th></tr></thead><tbody id="hist"><tr><td colspan="5" style="text-align:center;">Загрузка...</td></tr></tbody></table></div>
    </div>
</div>

<footer><a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">↑ Наверх</a></footer>

<script>
const API='http://localhost:8080/api';const T=localStorage.getItem('auth_token');const U=JSON.parse(localStorage.getItem('volanchiki_user')||'{}');if(!T&&!localStorage.getItem('isLoggedIn'))location.href='vxod.html';
document.getElementById('uname').textContent=U.fullName||'Игрок';document.getElementById('unick').textContent=U.nickname?'@'+U.nickname:'';
async function L(){if(!T){LL();return}try{const[p,rs,hs]=await Promise.all([fetch(API+'/users/me',{headers:{'Authorization':'Bearer '+T}}),fetch(API+'/registrations/my',{headers:{'Authorization':'Bearer '+T}}),fetch(API+'/ratings/'+(U.id||1)+'/history')]);if(p.ok){const d=await p.json();document.getElementById('uname').textContent=d.fullName;document.getElementById('unick').textContent='@'+d.nickname;document.getElementById('sr').textContent=d.singlesRating||100;document.getElementById('dr').textContent=d.doublesRating||100;}if(rs.ok)R(await rs.json());else LR();if(hs.ok)H(await hs.json());else LH();}catch(e){LL()}}
function LL(){document.getElementById('sr').textContent=localStorage.getItem('user_rating')||100;LR();LH();}
function LR(){R([{tournamentTitle:'Volan Open',tournamentStartDate:'05.04.2026',categoryCode:'MD',status:'CONFIRMED'},{tournamentTitle:'Чемпионат Москвы',tournamentStartDate:'20.04.2026',categoryCode:'MS',status:'PENDING'}]);}
function LH(){H([{formattedDate:'10.02.2026',tournamentTitle:'Зимний кубок',oldRating:1425,newRating:1350,changeValue:-75},{formattedDate:'01.01.2026',tournamentTitle:'Новогодний',oldRating:1400,newRating:1425,changeValue:25}]);}
function R(rs){const b=document.getElementById('regs');if(!rs.length){b.innerHTML='<tr><td colspan="4" style="text-align:center;">Нет регистраций</td></tr>';return}b.innerHTML=rs.map(r=>'<tr><td>'+r.tournamentTitle+'</td><td>'+(r.tournamentStartDate||'—')+'</td><td>'+(r.categoryCode||'—')+'</td><td><span class="badge '+(r.status==='CONFIRMED'?'badge-ok':'badge-wait')+'">'+r.status+'</span></td></tr>').join('');}
function H(h){const b=document.getElementById('hist');if(!h.length){b.innerHTML='<tr><td colspan="5" style="text-align:center;">Нет истории</td></tr>';return}b.innerHTML=h.map(i=>'<tr><td>'+i.formattedDate+'</td><td>'+(i.tournamentTitle||'—')+'</td><td>'+i.oldRating+'</td><td>'+i.newRating+'</td><td class="'+(i.changeValue>=0?'positive':'negative')+'">'+(i.changeValue>0?'+'+i.changeValue:i.changeValue)+'</td></tr>').join('');}
function logout(){localStorage.removeItem('auth_token');localStorage.removeItem('volanchiki_user');localStorage.removeItem('isLoggedIn');location.href='Glavnay.html';}
L();
</script>
</body>
</html>
